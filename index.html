<!DOCTYPE html>
<!-- Updated print functionality -->
<html>

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>파트너스 보드</title>
    <!-- PWA 지원을 위한 Manifest 및 Meta 태그 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="./pwa-icon-192.png">
    
    <script>
        // PWA 서비스 워커 등록 및 기존 캐시 간섭형 워커 해제
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    for (let registration of registrations) {
                        registration.unregister();
                        console.log('Legacy Service Worker Unregistered');
                    }
                    navigator.serviceWorker.register('./service-worker.js?v=2')
                        .then(reg => {
                            console.log('New Service Worker Registered!');
                            reg.update();
                        })
                        .catch(err => console.error('Service Worker registration failed:', err));
                });
            });
        }

        // PWA 설치 프롬프트 이벤트를 보관할 전역 변수
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const pwaSection = document.getElementById('pwa-install-section');
            if (pwaSection) {
                pwaSection.classList.remove('hidden');
            }
        });

        window.addEventListener('appinstalled', (evt) => {
            const pwaSection = document.getElementById('pwa-install-section');
            if (pwaSection) {
                pwaSection.classList.add('hidden');
            }
            deferredPrompt = null;
        });

        // 이미 PWA 단독 앱(standalone)으로 실행 중인지 체크
        function checkStandalone() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        }

        // 수동 가이드 열기/닫기
        window.togglePwaGuide = function (show) {
            const guideId = 'pwa-guide-modal';
            let modal = document.getElementById(guideId);
            if (!modal && show) {
                modal = document.createElement('div');
                modal.id = guideId;
                modal.className = "fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 fade-in";
                modal.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-100 ring-1 ring-black/5 flex flex-col">
                        <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-white">
                            <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                                <span class="w-1.5 h-5 bg-indigo-500 rounded-full block shadow-sm"></span>
                                기기별 앱 설치 방법 안내
                            </h3>
                            <button onclick="togglePwaGuide(false)" class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        <div class="p-6 overflow-y-auto max-h-[70vh] space-y-6 text-left text-sm text-gray-600 leading-relaxed">
                            <div class="space-y-2">
                                <p class="font-extrabold text-gray-800 text-sm flex items-center gap-1.5">
                                    <span class="w-4 h-4 rounded-full bg-blue-500 text-white text-[10px] flex items-center justify-center font-bold">1</span>
                                    안드로이드 (크롬 / 삼성 인터넷)
                                </p>
                                <ul class="list-disc pl-5 space-y-1 text-xs text-gray-500">
                                    <li>상단의 <strong>'파트너스 보드 설치하기'</strong> 버튼을 클릭하면 즉시 설치됩니다.</li>
                                    <li>만약 버튼이 보이지 않는다면, 우측 상단 메뉴(점 3개 또는 줄 3개)를 누르고 <strong>'홈 화면에 추가'</strong> 또는 <strong>'앱 설치'</strong>를 선택하세요.</li>
                                </ul>
                            </div>
                            <div class="space-y-2 border-t border-gray-100 pt-4">
                                <p class="font-extrabold text-gray-800 text-sm flex items-center gap-1.5">
                                    <span class="w-4 h-4 rounded-full bg-orange-500 text-white text-[10px] flex items-center justify-center font-bold">2</span>
                                    아이폰 / 아이패드 (iOS Safari)
                                </p>
                                <ul class="list-disc pl-5 space-y-1 text-xs text-gray-500">
                                    <li>아이폰은 하단(또는 상단) 툴바의 <strong>공유 버튼(네모에 위쪽 화살표)</strong>을 누릅니다.</li>
                                    <li>공유 메뉴에서 아래로 스크롤하여 <strong>'홈 화면에 추가'</strong>를 선택해 주세요.</li>
                                </ul>
                            </div>
                            <div class="space-y-2 border-t border-gray-100 pt-4">
                                <p class="font-extrabold text-gray-800 text-sm flex items-center gap-1.5">
                                    <span class="w-4 h-4 rounded-full bg-purple-500 text-white text-[10px] flex items-center justify-center font-bold">3</span>
                                    PC (Chrome, Edge 등)
                                </p>
                                <ul class="list-disc pl-5 space-y-1 text-xs text-gray-500">
                                    <li>브라우저 우측 상단 주소창(URL바) 오른쪽에 표시되는 <strong>'설치 아이콘(모니터 모양에 아래 화살표)'</strong>을 클릭하면 설치됩니다.</li>
                                </ul>
                            </div>
                        </div>
                        <div class="p-4 bg-gray-50 border-t border-gray-100 text-right">
                            <button onclick="togglePwaGuide(false)" class="px-6 py-2 bg-gray-800 hover:bg-gray-900 text-white font-medium rounded-xl transition text-xs shadow-md shadow-gray-200">닫기</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            }
            if (modal) {
                if (show) {
                    document.body.classList.add('modal-open');
                    modal.style.display = 'flex';
                } else {
                    document.body.classList.remove('modal-open');
                    modal.style.display = 'none';
                }
            }
        };

        // PWA 설치 트리거
        window.triggerPwaInstall = async function () {
            if (!deferredPrompt) {
                window.togglePwaGuide(true);
                return;
            }
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User choice outcome: ${outcome}`);
            deferredPrompt = null;
            const pwaSection = document.getElementById('pwa-install-section');
            if (pwaSection) {
                pwaSection.classList.add('hidden');
            }
        };
    </script>

    <!-- ========================================== -->
    <!-- [필수 설정] 구글 앱스 스크립트 웹앱 URL 입력 -->
    <!-- ========================================== -->
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzLj2pOu3gG1p8HhPC-t36bEwImkIFNfb9FAcO7WI3F_UP9wp6DsnCyUKUGBGtOT6BpTA/exec';
    </script>

    <!-- 카카오톡 인앱 브라우저 감지 및 기본 브라우저 강제 이동 -->
    <script>
        (function() {
            var ua = navigator.userAgent.toLowerCase();
            if (ua.indexOf('kakaotalk') > -1) {
                var targetUrl = window.location.href;
                if (ua.indexOf('android') > -1) {
                    // 안드로이드: 크롬 또는 기본 브라우저로 강제 이동
                    var rawUrl = targetUrl.replace(/^https?:\/\//, '');
                    window.location.href = 'intent://' + rawUrl + '#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end';
                } else if (ua.indexOf('iphone') > -1 || ua.indexOf('ipad') > -1 || ua.indexOf('ipod') > -1) {
                    // iOS: 외부 브라우저(Safari 등) 호출 시도
                    window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(targetUrl);
                    
                    // iOS의 경우 팝업이 차단되거나 멈출 수 있으므로 우회 안내 레이어를 화면에 표시
                    document.write(`
                        <div id="kakao-ios-guide" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: #fff; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-family: sans-serif; padding: 20px; box-sizing: border-box;">
                            <div style="background: #fff; color: #333; padding: 30px; border-radius: 20px; max-width: 90%; width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
                                <div style="font-size: 40px; margin-bottom: 15px;">🧭</div>
                                <h3 style="font-size: 18px; font-weight: bold; margin-bottom: 12px; color: #F37321;">Safari 브라우저로 이동 중...</h3>
                                <p style="font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 20px;">
                                    화면이 자동으로 이동하지 않는다면,<br>
                                    우측 상단 <strong>더보기 (···)</strong> 버튼을 누른 후<br>
                                    <strong>'다른 브라우저로 열기'</strong> 또는 <strong>'Safari로 열기'</strong>를 선택해 주세요.
                                </p>
                                <div style="font-size: 12px; color: #999; border-top: 1px solid #eee; padding-top: 12px;">
                                    기본 브라우저에서 정상적으로 로그인 및 앱 설치(PWA)가 가능합니다.
                                </div>
                            </div>
                        </div>
                    `);
                }
            }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F37321', // Orange
                        primaryHover: '#d96316',
                        secondary: '#1e293b', // Dark Blue/Gray
                        brandNavy: '#1B1F3B', // Deep Navy for Left Panel
                    },
                    animation: {
                        blob: "blob 7s infinite",
                        fadeIn: "fadeIn 0.5s ease-out forwards",
                    },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                            "100%": { transform: "translate(0px, 0px) scale(1)" },
                        },
                        fadeIn: {
                            "0%": { opacity: "0", transform: "translateY(10px)" },
                            "100%": { opacity: "1", transform: "translateY(0)" },
                        },
                    },
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-50 text-gray-800 font-sans antialiased text-sm md:text-base">
    <div id="error-log"
        style="display:none; color: white; padding: 12px; background: #ef4444; z-index:9999; position:fixed; top:0; left:0; width:100%; text-align:center; font-weight:bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    </div>

    <!-- Loading Spinner -->
    <div id="loading"
        class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex items-center justify-center hidden transition-opacity duration-300">
        <div class="bg-white p-6 rounded-2xl shadow-2xl flex flex-col items-center animate-fadeIn">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-10 w-10 mb-3"></div>
            <p class="text-gray-500 text-sm font-medium">Loading...</p>
        </div>
    </div>

    <div id="app" class="min-h-screen flex flex-col transition-colors duration-500">
        <div id="content" class="flex-grow flex flex-col w-full h-full"></div>
    </div>

    <!-- Password Change Modal -->
    <div id="pw-modal"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[90] hidden flex items-center justify-center p-4">
        <div
            class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm transform transition-all scale-100 animate-fadeIn text-center">
            <div class="text-center mb-6">
                <div
                    class="bg-orange-100 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 text-primary">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                        </path>
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-gray-900">비밀번호 변경</h3>
                <p class="text-sm text-gray-500 mt-1">보안을 위해 비밀번호를 변경해주세요.</p>
            </div>

            <form id="pwForm" class="space-y-4 text-left">
                <div>
                    <input type="password" id="newPw" placeholder="새 비밀번호 (4자리 이상)"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:border-primary focus:ring-2 focus:ring-orange-100 outline-none transition"
                        required>
                </div>
                <div>
                    <input type="password" id="confirmPw" placeholder="비밀번호 확인"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:border-primary focus:ring-2 focus:ring-orange-100 outline-none transition"
                        required>
                </div>
                <div class="flex justify-between gap-3 mt-6">
                    <button type="button" id="pwCancelBtn" onclick="closePwModal()"
                        class="flex-1 px-4 py-3 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl font-medium transition">취소</button>
                    <button type="submit"
                        class="flex-1 px-4 py-3 bg-primary text-white font-bold rounded-xl hover:bg-primaryHover shadow-lg shadow-orange-200 transition">변경하기</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
